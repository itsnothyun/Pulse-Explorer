name: omniview

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniview_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omniview}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniview} -d ${POSTGRES_DB:-omniview}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - omniview-core

  redis:
    image: redis:7-alpine
    container_name: omniview-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - omniview-core
      - omniview-worker-net

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: omniview-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omniview_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-omniview_minio_secret_key}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniview-core
      - omniview-worker-net

  omniview-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: omniview-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-omniview}:${POSTGRES_PASSWORD:-omniview_dev_secret}@postgres:5432/${POSTGRES_DB:-omniview}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-omniview_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-omniview_minio_secret_key}
      S3_BUCKET_FILES: omniview-files
      S3_BUCKET_ARTIFACTS: omniview-artifacts
    ports:
      - "${API_PORT:-4000}:4000"
    security_opt:
      - no-new-privileges:true
    networks:
      - omniview-core

  omniview-worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: omniview-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-omniview_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-omniview_minio_secret_key}
      S3_BUCKET_FILES: omniview-files
      S3_BUCKET_ARTIFACTS: omniview-artifacts
      WORKER_SCRATCH_DIR: /tmp/omniview-work
      WORKER_JOB_TIMEOUT_MS: "30000"
      HOME: /tmp/omniview-home
    read_only: true
    tmpfs:
      - /tmp/omniview-work:size=512m,mode=1770,uid=10001,gid=10001,noexec,nosuid,nodev
      - /tmp/omniview-home:size=64m,mode=1770,uid=10001,gid=10001,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - omniview-worker-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  omniview-core:
    driver: bridge
  omniview-worker-net:
    driver: bridge
    internal: true
