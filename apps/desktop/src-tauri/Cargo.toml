[package]
name = "omniview-desktop"
version = "1.0.0"
description = "OmniView Universal File & Document Viewer Desktop Shell (Tauri v2)"
authors = ["OmniView Architecture Team"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
lnk = "0.6.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
